<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bio Mapping — Live</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script src="vendor/leaflet/leaflet.js"></script>
<!-- Runtime config: window.BIOMAP_CONFIG. Committed; on a local origin it also pulls in the optional gitignored config.local.js. See config.local.example.js -->
<script src="config.js"></script>
<script src="src/signal/gsr_filter.js"></script>
<script src="src/map/map_colors.js"></script>
<script src="src/gps/gps_pipeline.js"></script>
<script src="src/live/live_binary_parser.js"></script>
<script src="src/live/live_state.js"></script>
<script src="src/live/live_bluetooth.js"></script>
<script src="src/live/live_csv.js"></script>
<script src="src/live/live_tile_cache.js"></script>
<script src="src/live/live_view.js"></script>
<style>
  :root {
    --bg: #0b0e11;
    --panel: #12161b;
    --border: #232a32;
    --text: #d7dee5;
    --muted: #7c8894;
    --accent: #00e5a0;
    --warn: #ffb020;
    --bad: #ff4d5e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; flex: 1 1 auto; min-width: 0; }
  .badge {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .badge.live { color: var(--accent); border-color: var(--accent); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.bad  { color: var(--bad);  border-color: var(--bad); }

  button {
    font-size: 13px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: #1b2229; color: var(--text);
    cursor: pointer; touch-action: manipulation;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); color: #04140e; border-color: var(--accent); font-weight: 600; }
  button.active { background: var(--warn); color: #04140e; border-color: var(--warn); font-weight: 600; }

  #graphWrap { position: relative; background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 34%; min-height: 120px; }
  #graph { width: 100%; height: 100%; display: block; }
  #graphLabel {
    position: absolute; top: 6px; left: 10px; font-size: 11px; color: var(--muted);
    pointer-events: none;
  }
  #graphValue {
    position: absolute; top: 6px; right: 10px; font-size: 13px; color: var(--text); font-weight: 600;
    pointer-events: none;
  }

  #liveMap { flex: 1 1 auto; min-height: 0; background: #05070a; }
  #app.no-map #liveMap { display: none; }
  #app.no-map #graphWrap { flex: 1 1 auto; border-bottom: none; }
  #app.no-map #locationBar { display: none; }

  #locationBar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  #locationBar input {
    font-size: 13px; padding: 6px 8px; border-radius: 6px; width: 130px;
    border: 1px solid var(--border); background: #1b2229; color: var(--text);
  }

  footer {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel); border-top: 1px solid var(--border); font-size: 12px; color: var(--muted);
    flex-wrap: wrap;
  }
  footer .stat { white-space: nowrap; }
  footer .spacer { flex: 1 1 auto; }

  #connectOverlay {
    position: fixed; inset: 0; background: rgba(5,7,10,0.92);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    text-align: center; padding: 24px;
    /* Leaflet's own CSS puts its tile/marker panes and controls at
       z-index 200-1000 (.leaflet-top/.leaflet-bottom alone are 1000).
       #map never establishes its own stacking context, so those values
       compete directly against this overlay in the same top-level
       stacking context — 20 loses. Comfortably above Leaflet's ceiling. */
    z-index: 10000;
  }
  #connectOverlay.hidden { display: none; }
  #connectOverlay p { color: var(--muted); max-width: 320px; font-size: 13px; margin: 0; }
  #connectOverlay .err { color: var(--bad); font-size: 12px; max-width: 320px; }
  #reconnectErr { color: var(--bad); font-size: 11px; flex-basis: 100%; }

  @media (max-width: 480px) {
    header { padding: 6px 8px; gap: 6px; }
    header h1 { font-size: 13px; }
    .badge { font-size: 11px; padding: 2px 6px; }
    button { font-size: 11px; padding: 4px 8px; }
    footer { padding: 4px 8px; font-size: 10px; }
  }
</style>
</head>
<body>
<!-- The entire live UI is built by GSRLiveView.mount() (src/live/live_view.js)
     so the same markup + wiring can be a panel inside index.html. This page
     is just the standalone host: one container, one mount call. -->
<div id="liveRoot"></div>
<script>
  GSRLiveView.mount(document.getElementById('liveRoot'));
</script>
</body>
</html>
