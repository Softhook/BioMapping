<style>
  /* Standalone page shell only — the live UI itself is styled by the
     ".live-view" section of styles.css. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  #liveRoot { height: 100%; }
</style>
</head>
<body>
<!-- The entire live UI is built by GSRLiveView.mount() (src/live/live_view.js)
     so the same markup + wiring can be a panel inside index.html. This page
     is just the standalone host: one container, one mount call. -->
<div id="liveRoot"></div>
<!-- Real entry point — imports the live view's src/ files (mirrored by
     LIVE_SCRIPT_ORDER in tests/support/boot_live.js; tests/test_script_order.js

<script type="module" src="src/live_entry.mjs"></script>
</body>
