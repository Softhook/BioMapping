name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  visualiser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visualiser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:deps
      - run: npm test
