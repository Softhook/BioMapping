; BioMapping firmware for the M5Stack Cardputer ADV.
; Build and flash from this folder:  pio run -t upload   then   pio device monitor
; (if pio isn't found: ~/.platformio/penv/bin/pio)
;
; The shared code in ../core/ and minmea in ../vendor/ are built straight
; from where they are; nothing is copied. See docs/cardputer_port.md.
[env:cardputer]
platform = espressif32@8.0.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
; The Cardputer firmware's version: change it for each release. It goes in
; the "# Firmware" line of every recording, with the exact build (git
; commit), through build_info.py. The Flipper has its own number
; (fap_version in ../application.fam).
custom_firmware_version = 1.0.0
extra_scripts = post:build_info.py
build_src_filter =
    +<*>
    +<../../core/*.c>
    +<../../vendor/minmea/minmea.c>
; USB through the chip's own USB serial port (ARDUINO_USB_MODE=1, the
; board's default), so flashing and restarting need no 1200-baud touch.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I ../core
; Strict warnings for our own code and core/ only, not the M5Stack libraries.
build_src_flags =
    -Wall
    -Wextra
    -Werror
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
