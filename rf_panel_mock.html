<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background:#222; color:#ccc; font-family:monospace; padding:20px; }
  .row { margin-bottom:18px; }
  canvas { background:#000; image-rendering:pixelated; width:512px; height:256px; border:1px solid #444; }
  .lbl { font-size:12px; margin-top:4px; color:#aaa; }
  input { margin-left:8px; }
</style>
</head>
<body>
<h3>BioMapping GPS+GSR+RF mock (128x64, 4x)</h3>
<div class="row">
  <label><input type="checkbox" id="cal" checked> Use calibrated floors</label>
  <span class="lbl" style="display:inline">815 floor <input type="range" id="f0" min="-110" max="-88" value="-90.5" step="0.5"></span><span id="vf0"></span>
  <span class="lbl" style="display:inline">868 floor <input type="range" id="f1" min="-110" max="-88" value="-91.5" step="0.5"></span><span id="vf1"></span>
  <span class="lbl" style="display:inline">915 floor <input type="range" id="f2" min="-110" max="-88" value="-91.5" step="0.5"></span><span id="vf2"></span>
</div>
<div class="row">
  <label>815 dBm <input type="range" id="r0" min="-100" max="-40" value="-81" step="0.5"></label>
  <span id="v0"></span>
  <label>868 dBm <input type="range" id="r1" min="-100" max="-40" value="-85" step="0.5"></label>
  <span id="v1"></span>
  <label>915 dBm <input type="range" id="r2" min="-100" max="-40" value="-91.5" step="0.5"></label>
  <span id="v2"></span>
</div>
<canvas id="cv" width="128" height="64"></canvas>
<div class="lbl">Top bar: GPS badge / nS / elapsed. Graph on right 2/3, RF panel left with labels 815/868/915.</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const RF_VIZ_FLOOR_DBM = -90.0, RF_VIZ_CEIL_DBM = -72.0;
const RF_PANEL_W = 43;
const LABELS = ['815', '868', '915'];

function barH(floor, dbm, span, maxW) {
  let frac = (dbm - floor) / span;
  frac = Math.max(0, Math.min(1, frac));
  return Math.round(frac * maxW);
}

// Replicates draw_rf_panel_left exactly (label under bar, per-band floor)
function drawRfPanel(rssi, floors, useCal) {
  const row_h = 15, row_gap = 1, panel_x = 1, bar_h = 6, bar_max_w = 41 - panel_x;
  const span = 18;
  ctx.font = '7px monospace';
  for (let i = 0; i < 3; i++) {
    const row_top = 16 + i * (row_h + row_gap); // 16/32/48
    const floor = (useCal ? floors[i] : -90);
    const w = barH(floor, rssi[i], span, bar_max_w);
    ctx.fillStyle = '#fff';
    if (w > 0) ctx.fillRect(panel_x, row_top, w, bar_h);
    ctx.fillText(LABELS[i] + ' MHz', panel_x, row_top + row_h - 1);
  }
}

function drawGraph() {
  // frame at (43,16,85,48)
  const gx = RF_PANEL_W, gy = 16, gw = 128 - RF_PANEL_W, gh = 48;
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(gx, gy, gw, gh);
  // notches above graph
  for (let x = gx + 10; x < gx + gw; x += 10) {
    ctx.fillRect(x, gy - 3, 1, 3);
  }
  // sine wave
  ctx.beginPath();
  for (let i = 0; i < gw - 2; i++) {
    const t = i / (gw - 2);
    const v = Math.sin(t * Math.PI * 6 + performance.now() / 600) * 0.5;
    const y = gy + gh / 2 - v * (gh / 2 - 2);
    if (i === 0) ctx.moveTo(gx + 1 + i, y); else ctx.lineTo(gx + 1 + i, y);
  }
  ctx.stroke();
}

function drawTopBar() {
  ctx.font = '8px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('3.2m', 1, 10);      // GPS badge top-left
  ctx.fillText('5420 nS', 128 - 55, 10); // nS top-right
  ctx.fillText('12m', 50, 10);      // elapsed time centered
}

function render() {
  ctx.clearRect(0, 0, 128, 64);
  ctx.fillStyle = '#fff';
  ctx.font = '8px monospace';
  drawTopBar();
  drawGraph();
  const rssi = [+document.getElementById('r0').value,
                +document.getElementById('r1').value,
                +document.getElementById('r2').value];
  const floors = [+document.getElementById('f0').value,
                  +document.getElementById('f1').value,
                  +document.getElementById('f2').value];
  const useCal = document.getElementById('cal').checked;
  document.getElementById('v0').textContent = rssi[0];
  document.getElementById('v1').textContent = rssi[1];
  document.getElementById('v2').textContent = rssi[2];
  document.getElementById('vf0').textContent = floors[0];
  document.getElementById('vf1').textContent = floors[1];
  document.getElementById('vf2').textContent = floors[2];
  drawRfPanel(rssi, floors, useCal);
}

document.querySelectorAll('input').forEach(i => i.addEventListener('input', render));
render();
</script>
</body>
</html>
